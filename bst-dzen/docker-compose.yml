services:
  app:
    build:
      context: docker/php
    working_dir: /var/www/api
    volumes:
      - ./api:/var/www/api
      - ../data:/var/www/data:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: docker/php
    working_dir: /var/www/api
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./api:/var/www/api
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    build:
      context: docker/php
    working_dir: /var/www/api
    command: php artisan schedule:work
    volumes:
      - ./api:/var/www/api
    depends_on:
      - app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/api/public:ro
      - ./client/dist:/var/www/client:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: dzen
      MYSQL_USER: dzen
      MYSQL_PASSWORD: dzen_secret
      MYSQL_ROOT_PASSWORD: root_secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql_data:
